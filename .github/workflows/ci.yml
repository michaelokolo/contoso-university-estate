# CI: runs on every pull request (and on main after merge). Must be green before a PR can merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint and test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements.txt"

      - name: Install dependencies
        run: |
          pip install ruff pytest
          pip install -r data-generator/requirements.txt \
                      -r systems/sis/requirements.txt \
                      -r systems/finance/requirements.txt \
                      -r systems/portal/requirements.txt \
                      -r systems/events/requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest)
        run: pytest

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check both compose profiles parse
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose --profile vendors config --quiet
